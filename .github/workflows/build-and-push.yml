name: build-and-push

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Debug env
        run: |
          set -ex
          echo "node: $(node --version 2>&1 || echo missing)"
          echo "npm:  $(npm --version 2>&1 || echo missing)"
          echo "docker: $(docker --version 2>&1 || echo missing)"
          echo "buildx: $(docker buildx version 2>&1 || echo missing)"
          ls -la

      - name: Build (no push)
        run: |
          set -ex
          docker buildx build \
            --progress=plain \
            --tag ${REGISTRY}/${IMAGE_NAME}:v0.1.0 \
            --tag ${REGISTRY}/${IMAGE_NAME}:debug-${GITHUB_SHA::7} \
            --load \
            .
          echo "---list images---"
          docker images | head -20

      - name: Login to ghcr.io
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ${{ env.REGISTRY }} -u ${{ github.actor }} --password-stdin

      - name: Push
        run: |
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:v0.1.0
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:debug-${GITHUB_SHA::7}

      - name: Capture image manifest digest
        run: |
          DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:v0.1.0 2>/dev/null || true)
          echo "RepoDigests: $DIGEST"
          echo "Bunny image reference (recommended): ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@v0.1.0"
          echo "Bunny image reference (HEAD):       ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@main"

      - name: Show resolved tags
        if: always()
        run: |
          echo "Run URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
